name: Probe validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          node --version
          python3 --version
      - name: Repository contracts
        run: node --test Tests/Repository/*.test.mjs
      - name: Fixture generation and integrity
        run: |
          python3 Tests/Repository/fixtures_test.py
          python3 scripts/generate-fixtures.py
          python3 scripts/verify-fixtures.py
      - name: Compile the app and both extensions
        run: xcodebuild -project PeekProbe.xcodeproj -scheme PeekProbe -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run native file probe smoke tests
        run: |
          mkdir -p build
          swiftc -swift-version 6 POC/Shared/FileProbe.swift Tests/Probe/ProbeSmokeTests.swift -o build/probe-tests
          build/probe-tests
      # This job deliberately cannot establish signing, sandbox grants or Finder routing.
